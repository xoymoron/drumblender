model:
  class_path: drumblender.tasks.DrumBlender
  init_args:
    encoder: null
    modal_synth: drumblender.synths.ModalSynth
    modal_autoencoder: null
    transient_synth: synths/transient_tcn.yaml
    transient_autoencoder: models/encoder/transient_soundstream.yaml
    transient_autoencoder_accepts_audio: true
    transient_takes_noise: false
    noise_synth: synths/noise.yaml
    noise_autoencoder: models/encoder/noise_soundstream.yaml
    noise_autoencoder_accepts_audio: true
    loss_fn: loss/mss.yaml
    transient_parallel: false
    float32_matmul_precision: medium
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0001
lr_scheduler:
  class_path: pytorch_lightning.cli.ReduceLROnPlateau
  init_args:
    monitor: validation/loss
    factor: 0.5
    patience: 10
    min_lr: 0.00000625
data: data/custom_all.yaml
trainer:
  replace_sampler_ddp: false
  devices: 1
  accelerator: gpu
  max_epochs: 150
  accumulate_grad_batches: 8
  callbacks:
    - class_path: pytorch_lightning.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: validation/loss
        patience: 20
        check_finite: true
        # Count patience at epoch boundaries even when validation runs multiple times per epoch.
        check_on_train_epoch_end: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        # Save checkpoints under repository-local `ckpt/` for easy reuse.
        dirpath: ckpt
        filename: epoch{epoch:03d}-step{step:08d}
        # Avoid duplicated names like `epochepoch=...`.
        auto_insert_metric_name: false
        monitor: validation/loss
        mode: min
        save_top_k: 10
        save_last: true
        save_on_train_epoch_end: true
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
    - class_path: drumblender.callbacks.LogAudioCallback
      init_args:
        on_train: true
        on_val: true
        on_test: false
        save_audio_sr: 48000
        n_batches: 1
        log_on_epoch_end: true
        max_audio_samples: 8
seed_everything: 20261106
