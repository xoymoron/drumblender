class_path: drumblender.models.dac_style.DACStyleSequenceEncoder
init_args:
  input_channels: 1
  hidden_channels: 16
  output_channels: 128
  strides: [2, 2, 4, 8]
  causal: false
  transpose_output: true
  use_weight_norm: true
  lstm_hidden_size: 256
  lstm_layers: 2
  lstm_dropout: 0.0
  padding_aware_backbone: true
  length_aware_lstm: true
  mask_invalid_frames: true
