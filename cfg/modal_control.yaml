# Dedicated configuration for scripts.train_modal_control (not the legacy CLI).
seed: 20261106
model:
  sample_rate: 48000
  channels: 64
  context_tokens: 8
  features: 256
  top_k: 8
  learning_rate: 0.0001
  mask_probability: 0.15
  modal_audio_weight: 0.1
  anchor_weight: 1.0
  residual_weight: 0.1
data:
  # Per GPU: 4 x 2 GPUs x accumulation 8 preserves effective batch 64.
  batch_size: 4
  num_workers: 4
trainer:
  accelerator: gpu
  devices: 2
  max_epochs: 150
  accumulate_grad_batches: 8
