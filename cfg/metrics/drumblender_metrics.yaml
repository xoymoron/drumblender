class_path: torch.nn.ModuleDict
init_args:
  modules:
    lsd:
      class_path: drumblender.metrics.LogSpectralDistance
    flux_onset:
      class_path: drumblender.metrics.SpectralFluxOnsetError
    mr_stft:
      class_path: auraloss.freq.MultiResolutionSTFTLoss
      init_args:
        fft_sizes:
        - 1024
        - 2048
        - 512
        hop_sizes:
        - 120
        - 240
        - 50
        win_lengths:
        - 600
        - 1200
        - 240
        window: hann_window
        w_sc: 1.0
        w_log_mag: 1.0
        w_lin_mag: 0.0
        w_phs: 0.0
        sample_rate: null
        scale: null
        n_bins: null
        scale_invariance: false
        eps: 1.0e-08
        output: loss
        reduction: mean
        device: null
    mr_log_mel:
      class_path: drumblender.metrics.MultiResolutionLogMelDistance
      init_args:
        sample_rate: 48000
        fft_sizes: [512, 2048, 8192]
        hop_sizes: [128, 512, 2048]
        n_mels: [40, 80, 128]
        f_min: 20.0
        f_max: 20000.0
        eps: 1.0e-05
    band_spectral:
      class_path: drumblender.metrics.BandSpectralErrors
      init_args:
        sample_rate: 48000
        n_fft: 4096
        hop_size: 256
        bands:
        - [low, 20, 250]
        - [mid, 250, 4000]
        - [high, 4000, 20000]
        eps: 1.0e-08
    log_rms_envelope:
      class_path: drumblender.metrics.LogRMSEnvelopeError
      init_args:
        frame_size: 1024
        hop_size: 256
        eps: 1.0e-05
