[build-system]
requires = ["setuptools==80.9.0", "wheel>=0.46.3", "packaging>=24"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drumblender*"]

[project]
name = "drumblender"
version = "0.0.1"
requires-python = ">=3.10,<3.13"
dependencies = [
    "auraloss==0.3.0",
    "numpy==1.26.4",
    "PyYAML>=6,<7",
    "scipy>=1.10,<2",
    "soundfile>=0.12,<1",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchmetrics==0.11.4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["black", "ruff==0.17.3", "pytest", "pre-commit"]
train = ["pytorch-lightning==1.9.5", "lightning-utilities==0.8.0", "setuptools==80.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py310"
line-length = 88
extend-exclude = [".venv*", "logs", "pytest-of-*"]
force-exclude = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
# Preserve existing zip truncation semantics; strictness requires a separate audit.
ignore = ["B905"]
